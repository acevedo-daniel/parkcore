# TEMPLATE — ci.yml
# Place: /.github/workflows/ci.yml
# When: the project protects main and validates changes through automated CI.
# Rules:
# - Standardize the contract, not the technology.
# - The final branch protection required check MUST be `CI Gate`.
# - PR-only CI requires the Ruleset to require up-to-date branches (setup-ci assets/ruleset.json).
# - Procedure, gate vocabulary, and ruleset: the setup-ci skill.
# - Keep job names conceptual and standardized: Quality, Tests, Integration, Contract, E2E, Production, Docker, CI Gate (scoped as <Gate> / <Scope> when needed).
# - Fill commands with the project's real tools; comment or remove unused gates.
# - Remove this header comment before committing to a project; the placeholder guard rejects any line starting with TEMPLATE.

name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check unfilled template placeholders
        run: |
          status=0
          git grep -nE '<(FILL|OPTIONAL)[:>]|^(# )?TEMPLATE |^status: template$' -- . ':!.agents/' ':!.claude/' ':!*.template.*' || status=$?
          if [ "$status" -ne 1 ]; then echo "::error::Unfilled template placeholders or template headers found"; exit 1; fi

