        run: echo "::error::Unfilled CI placeholder" && exit 1  # <FILL: production build or container verification command>

  ci-gate:
    name: CI Gate
    if: always()
    needs:
      - quality
      - tests
      # - e2e # Uncomment if E2E gate is active
      - production
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify required upstream jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then echo "::error::A required job finished with: $result"; exit 1; fi
          done
