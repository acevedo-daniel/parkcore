name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://parkcore:parkcore@localhost:5432/parkcore-db
    services:
      parkcore-db:
        image: postgres:18.1
        env:
          POSTGRES_USER: parkcore
          POSTGRES_PASSWORD: parkcore
          POSTGRES_DB: parkcore-db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parkcore -d parkcore-db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Database bootstrap check
        run: pnpm --filter @parkcore/api db:setup

      - name: API quality checks
        run: pnpm --filter @parkcore/api quality:ci

      - name: API build and release readiness checks
        run: pnpm --filter @parkcore/api release:readiness

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_API_URL: https://api.example.invalid

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend checks
        run: pnpm --filter @parkcore/web lint && pnpm --filter @parkcore/web typecheck && pnpm --filter @parkcore/web test && pnpm --filter @parkcore/web build

  web-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @parkcore/web exec playwright install --with-deps chromium

      - name: Run browser workflow
        run: pnpm --filter @parkcore/web test:e2e

  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify generated API contract
        run: pnpm contract:check
