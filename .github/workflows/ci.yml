name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://parkcore:parkcore@localhost:5432/parkcore-ci

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify authored text
        run: pnpm text:check

      - name: Verify localization parity
        run: pnpm locales:check

      - name: Verify formatting
        run: pnpm format:check

      - name: Generate Prisma client
        run: pnpm --filter @parkcore/api prisma:generate

      - name: Build API client
        run: pnpm --filter @parkcore/api-client build

      - name: Run lint
        run: pnpm lint

      - name: Run typecheck
        run: pnpm typecheck

  api_tests_integration:
    name: Tests / API
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://parkcore:parkcore@localhost:5432/parkcore-db
    services:
      parkcore-db:
        image: postgres:18.1
        env:
          POSTGRES_USER: parkcore
          POSTGRES_PASSWORD: parkcore
          POSTGRES_DB: parkcore-db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parkcore -d parkcore-db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bootstrap PostgreSQL database
        run: pnpm --filter @parkcore/api db:setup

      - name: Run API coverage tests
        run: pnpm --filter @parkcore/api test:coverage

  web_tests:
    name: Tests / Web
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API client
        run: pnpm --filter @parkcore/api-client build

      - name: Run web tests
        run: pnpm --filter @parkcore/web test

  contract:
    name: Contract
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify generated API contract
        run: pnpm contract:check

  real_stack_e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://parkcore:parkcore@localhost:5432/parkcore-e2e

    services:
      parkcore-e2e-db:
        image: postgres:18.1
        env:
          POSTGRES_USER: parkcore
          POSTGRES_PASSWORD: parkcore
          POSTGRES_DB: parkcore-e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parkcore -d parkcore-e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API client
        run: pnpm --filter @parkcore/api-client build

      - name: Install Playwright Chromium
        run: pnpm --filter @parkcore/web exec playwright install --with-deps chromium

      - name: Run local real-stack browser workflow
        run: pnpm --filter @parkcore/web test:e2e:local

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-e2e-local-real-stack-diagnostics
          path: |
            apps/web/test-results/local-real-stack/
            apps/web/playwright-report/local-real-stack/
          if-no-files-found: ignore

  hardening_e2e:
    name: E2E / Web
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API client
        run: pnpm --filter @parkcore/api-client build

      - name: Install Playwright Chromium
        run: pnpm --filter @parkcore/web exec playwright install --with-deps chromium

      - name: Run browser hardening matrix
        run: pnpm --filter @parkcore/web test:e2e:hardening

      - name: Upload browser hardening diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-e2e-hardening-diagnostics
          path: |
            apps/web/test-results/hardening/
            apps/web/playwright-report/hardening/
          if-no-files-found: ignore

  production:
    name: Production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://parkcore:parkcore@localhost:5432/parkcore-build
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: ci-only-production-verification-secret-1234567890
      JWT_EXPIRES_IN: 24h
      CORS_ORIGINS: https://parkcore-app.vercel.app
      LOG_LEVEL: info
      LOG_PRETTY: 'false'
      ENABLE_API_DOCS: 'false'
      DEMO_CLEANUP_BATCH_SIZE: 1
      PARKCORE_ARTIFACT_PRIVATE_VALUES: |-
        ci-seed-owner@example.invalid
        ci-seed-password-not-for-production
      VITE_API_URL: https://parkcore-api.onrender.com

    services:
      parkcore-production-db:
        image: postgres:18.1
        env:
          POSTGRES_USER: parkcore
          POSTGRES_PASSWORD: parkcore
          POSTGRES_DB: parkcore-build
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parkcore -d parkcore-build"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare production diagnostics
        run: mkdir -p .ci/production

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee .ci/production/install.log

      - name: Audit production dependencies
        run: |
          set -o pipefail
          pnpm audit --prod 2>&1 | tee .ci/production/audit.log

      - name: Apply forward migrations to the fresh database
        run: |
          set -o pipefail
          pnpm --filter @parkcore/api prisma:migrate:deploy 2>&1 | tee .ci/production/migrations.log

      - name: Build deployable workspaces
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee .ci/production/build.log

      - name: Bootstrap canonical public showcase
        run: |
          set -o pipefail
          pnpm --filter @parkcore/api showcase:refresh 2>&1 | tee .ci/production/showcase.log

      - name: Verify compiled API artifact
        run: |
          set -o pipefail
          pnpm --filter @parkcore/api exec tsx src/scripts/check-build-artifact.ts 2>&1 | tee .ci/production/api-artifact.log

      - name: Verify web artifact secret boundary
        run: |
          set -o pipefail
          node scripts/check-web-build-artifact.mjs 2>&1 | tee .ci/production/web-artifact.log

      - name: Start compiled API and run startup smoke
        run: |
          set -Eeuo pipefail
          node apps/api/dist/server.js > .ci/production/api.log 2>&1 &
          api_pid=$!

          cleanup() {
            exit_code=$?
            if kill -0 "$api_pid" 2>/dev/null; then
              kill -TERM "$api_pid" 2>/dev/null || true
              wait "$api_pid" 2>/dev/null || true
            fi
            exit "$exit_code"
          }

          trap cleanup EXIT
          SMOKE_BASE_URL=http://127.0.0.1:3000 \
            SMOKE_RETRIES=10 \
            SMOKE_TIMEOUT_MS=5000 \
            pnpm --filter @parkcore/api smoke:remote 2>&1 | tee .ci/production/startup-smoke.log

      - name: Verify bounded demo cleanup
        run: |
          set -o pipefail
          pnpm --filter @parkcore/api demo:cleanup:check 2>&1 | tee .ci/production/demo-cleanup.log

      - name: Upload production diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: production-diagnostics
          path: .ci/production/
          if-no-files-found: ignore
          retention-days: 7

  ci_gate:
    name: CI Gate
    if: always()
    needs:
      - quality
      - api_tests_integration
      - web_tests
      - contract
      - real_stack_e2e
      - hardening_e2e
      - production
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify required jobs
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          API_RESULT: ${{ needs.api_tests_integration.result }}
          WEB_RESULT: ${{ needs.web_tests.result }}
          CONTRACT_RESULT: ${{ needs.contract.result }}
          E2E_RESULT: ${{ needs.real_stack_e2e.result }}
          E2E_WEB_RESULT: ${{ needs.hardening_e2e.result }}
          PRODUCTION_RESULT: ${{ needs.production.result }}
        run: |
          test "$QUALITY_RESULT" = "success"
          test "$API_RESULT" = "success"
          test "$WEB_RESULT" = "success"
          test "$CONTRACT_RESULT" = "success"
          test "$E2E_RESULT" = "success"
          test "$E2E_WEB_RESULT" = "success"
          test "$PRODUCTION_RESULT" = "success"
