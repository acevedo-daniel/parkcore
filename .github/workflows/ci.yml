name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://parkcore:parkcore@localhost:5432/parkcore-ci

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify authored text
        run: pnpm text:check

      - name: Verify formatting
        run: pnpm format:check

      - name: Generate Prisma client
        run: pnpm --filter @parkcore/api prisma:generate

      - name: Build API client
        run: pnpm --filter @parkcore/api-client build

      - name: Run lint
        run: pnpm lint

      - name: Run typecheck
        run: pnpm typecheck

  api_tests_integration:
    name: Tests / API
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://parkcore:parkcore@localhost:5432/parkcore-db
    services:
      parkcore-db:
        image: postgres:18.1
        env:
          POSTGRES_USER: parkcore
          POSTGRES_PASSWORD: parkcore
          POSTGRES_DB: parkcore-db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parkcore -d parkcore-db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bootstrap PostgreSQL database
        run: pnpm --filter @parkcore/api db:setup

      - name: Run API coverage tests
        run: pnpm --filter @parkcore/api test:coverage

  web_tests:
    name: Tests / Web
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API client
        run: pnpm --filter @parkcore/api-client build

      - name: Run web tests
        run: pnpm --filter @parkcore/web test

  contract:
    name: Contract
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify generated API contract
        run: pnpm contract:check

  real_stack_e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://parkcore:parkcore@localhost:5432/parkcore-e2e

    services:
      parkcore-e2e-db:
        image: postgres:18.1
        env:
          POSTGRES_USER: parkcore
          POSTGRES_PASSWORD: parkcore
          POSTGRES_DB: parkcore-e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parkcore -d parkcore-e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API client
        run: pnpm --filter @parkcore/api-client build

      - name: Install Playwright Chromium
        run: pnpm --filter @parkcore/web exec playwright install --with-deps chromium

      - name: Run local real-stack browser workflow
        run: pnpm --filter @parkcore/web test:e2e:local

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-local-real-stack-diagnostics
          path: |
            apps/web/test-results/local-real-stack/
            apps/web/playwright-report/local-real-stack/
          if-no-files-found: ignore

  production:
    name: Production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://parkcore:parkcore@localhost:5432/parkcore-build
      VITE_API_URL: https://api.example.invalid

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build deployable workspaces
        run: pnpm build

  ci_gate:
    name: CI Gate
    if: always()
    needs:
      - quality
      - api_tests_integration
      - web_tests
      - contract
      - real_stack_e2e
      - production
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify required jobs
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          API_RESULT: ${{ needs.api_tests_integration.result }}
          WEB_RESULT: ${{ needs.web_tests.result }}
          CONTRACT_RESULT: ${{ needs.contract.result }}
          E2E_RESULT: ${{ needs.real_stack_e2e.result }}
          PRODUCTION_RESULT: ${{ needs.production.result }}
        run: |
          test "$QUALITY_RESULT" = "success"
          test "$API_RESULT" = "success"
          test "$WEB_RESULT" = "success"
          test "$CONTRACT_RESULT" = "success"
          test "$E2E_RESULT" = "success"
          test "$PRODUCTION_RESULT" = "success"
