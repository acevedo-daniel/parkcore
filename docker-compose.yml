name: parkcore

services:
  parkcore-db:
    image: postgres:18.1
    container_name: parkcore-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: parkcore
      POSTGRES_PASSWORD: parkcore
      POSTGRES_DB: parkcore-db
    ports:
      - '5432:5432'
    volumes:
      - parkcore-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U parkcore -d parkcore-db']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
volumes:
  parkcore-data:
    name: parkcore-data
    driver: local
