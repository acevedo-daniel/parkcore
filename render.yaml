services:
  - type: web
    name: parkcore-api
    runtime: node
    plan: free
    branch: main
    rootDir: .

    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm --filter @parkcore/api build && pnpm --filter @parkcore/api prisma:migrate:deploy

    startCommand: pnpm --filter @parkcore/api start

    healthCheckPath: /healthz

    autoDeployTrigger: checksPass

    envVars:
      - key: NODE_ENV
        value: production

      - key: LOG_LEVEL
        value: info

      - key: LOG_PRETTY
        value: 'false'

      - key: ENABLE_API_DOCS
        value: 'false'

      - key: DATABASE_URL
        sync: false

      - key: JWT_SECRET
        sync: false

      - key: CORS_ORIGINS
        sync: false
